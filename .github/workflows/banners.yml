name: validate

on:
  push:
    branches: [develop, main]
    paths:
      - 'profile/mantras.yml'
      - 'profile/images/source/**'
      - 'assets/fonts/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'profile/README*.md'
  pull_request:
    paths:
      - 'profile/mantras.yml'
      - 'profile/images/source/**'
      - 'assets/fonts/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'profile/README*.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate generated banners
        run: npm run check:banners
