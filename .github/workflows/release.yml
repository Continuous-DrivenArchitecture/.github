name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Miguel Cespedes
          GIT_AUTHOR_EMAIL: miguelcespedes@outlook.com
          GIT_COMMITTER_NAME: Miguel Cespedes
          GIT_COMMITTER_EMAIL: miguelcespedes@outlook.com
      - name: Verify release commit author
        run: |
          author="$(git log -1 --format=%an <%ae>)"
          expected="Miguel Cespedes <miguelcespedes@outlook.com>"
          if [ "$author" != "$expected" ]; then
            echo "::error::release commit authored by '$author', expected '$expected'" >&2
            exit 1
          fi
